language: go
# compiler floor: the looper runs the latest 2.5.x image (stratum, a dependency, needs 2.5: #7).
tacplus: "2.5"
# pkg is derived from go.mod (github.com/tacplus-dev/blobstore: the org name has a hyphen,
# which pkg cannot carry). A derived Go package is <module>/tacplus, so the output is "tacplus".
output-dir: tacplus
output-name: tacplus
src: proto
# records here declare residency; the record query plane that reads them is the
# query trait hosted by stratum, so stratum's contract is part of this build.
depends:
  # topics declared here publish through the eventbus broker.
  - eventbus
  - stratum
